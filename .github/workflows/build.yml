name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repository download
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ZIP files extract
      - name: Extract ZIP project
        shell: bash
        run: |
          set -e

          shopt -s nullglob

          found_zip=false

          for f in *.zip; do
            found_zip=true
            echo "Extracting: $f"
            unzip -q "$f" -d extracted
          done

          if [ "$found_zip" = false ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # 3. Find the actual project folder
      - name: Locate project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          echo "Project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: '${{ env.PROJECT_DIR }}/package-lock.json'

      # 5. Install Node dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      # 6. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Check Capacitor project
      - name: Check project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Android directory:"
          if [ -d android ]; then
            ls -la android
          else
            echo "Android directory does not exist."
          fi

      # 9. Create Android platform if necessary and sync Capacitor
      - name: Prepare Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform missing. Creating it..."
            npx cap add android
          fi

          echo "Running Capacitor sync..."
          npx cap sync android

      # 10. Build Debug APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-debug-apk
          path: '${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
